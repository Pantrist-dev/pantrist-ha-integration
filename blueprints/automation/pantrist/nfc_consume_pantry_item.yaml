blueprint:
  name: "Pantrist: Consume a pantry item by scanning an NFC tag"
  description: >
    Stick an NFC tag on something you re-stock often (washing-up liquid,
    pasta jar, coffee tin…). Scanning the tag — with the Home Assistant
    Companion app, an ESPHome PN532, or any other HA-supported tag
    reader — decrements that item's pantry amount in Pantrist by the
    configured step. Pair this with the
    "Auto-add low-stock pantry items to the shopping list" blueprint
    and an empty jar lands on the shopping list the moment you scan it
    past zero.

    One blueprint instance per (tag, pantry item) pair. The pantry item
    UUID is the ``uuid`` field on whichever item you target — find it
    on the ``sensor.<list>_pantry`` entity's ``items`` attribute.
  source_url: https://github.com/Pantrist-dev/pantrist-ha-addon/blob/main/blueprints/automation/pantrist/nfc_consume_pantry_item.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    nfc_tag:
      name: NFC tag
      description: The tag to scan. Use the "Tags" page in HA to pick or create one.
      selector:
        tag: {}
    item_id:
      name: Pantry item UUID
      description: >
        Open ``sensor.<list>_pantry`` in **Developer Tools → States**,
        copy the ``uuid`` of the item you want this tag to consume,
        and paste it here.
      selector:
        text: {}
    amount:
      name: Consume amount per scan
      description: How much to subtract on each scan. Defaults to 1.
      default: 1
      selector:
        number:
          min: 0.01
          step: 0.1
          mode: box
    list_id:
      name: List ID (optional)
      description: >
        Leave blank on single-list accounts. With multiple lists, paste
        the list UUID — visible on **Settings → Devices & Services →
        Pantrist → device identifiers**.
      default: ""
      selector:
        text: {}

mode: single
max_exceeded: silent

trigger:
  - platform: tag
    tag_id: !input nfc_tag

variables:
  amount: !input amount
  item_id: !input item_id
  list_id: !input list_id

action:
  - choose:
      - conditions: "{{ list_id | trim != '' }}"
        sequence:
          - action: pantrist.change_pantry_item_amount
            data:
              item_id: "{{ item_id }}"
              change: "{{ 0 - (amount | float) }}"
              list_id: "{{ list_id }}"
    default:
      - action: pantrist.change_pantry_item_amount
        data:
          item_id: "{{ item_id }}"
          change: "{{ 0 - (amount | float) }}"
