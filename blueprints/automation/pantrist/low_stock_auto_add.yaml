blueprint:
  name: "Pantrist: Auto-add low-stock pantry items to the shopping list"
  description: >
    Whenever an item in your Pantrist pantry drops at or below its
    configured minimum amount, automatically add it (by name) to the
    shopping list. Items that are already on the shopping list (by
    name match) are skipped, so this blueprint composes safely with
    the API-side ``autoRestock`` flag — if the server already restocked
    on the same decrement, the blueprint becomes a no-op for that item.
  source_url: https://github.com/Pantrist-dev/pantrist-ha-addon/blob/main/blueprints/automation/pantrist/low_stock_auto_add.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    pantry_sensor:
      name: Pantry sensor
      description: Usually `sensor.pantrist_pantry`. Pick the one for the list you want to monitor.
      selector:
        entity:
          domain: sensor
          integration: pantrist
      default: sensor.pantrist_pantry
    shopping_sensor:
      name: Shopping-list sensor
      description: >
        Pantrist shopping-list sensor for the SAME list as the pantry
        sensor above (typically ``sensor.<list>_shopping_list``). Used
        to skip items that are already on the list — prevents double-
        adds when the server-side ``autoRestock`` flag is also in
        play.
      selector:
        entity:
          domain: sensor
          integration: pantrist
      default: sensor.pantrist_shopping_list

mode: queued
max: 10

trigger:
  - platform: state
    entity_id: !input pantry_sensor
    attribute: low_stock_items

condition:
  - condition: template
    value_template: >
      {{ state_attr(trigger.entity_id, 'low_stock_count') | int(0) > 0 }}

variables:
  shopping_sensor: !input shopping_sensor

action:
  - variables:
      low_stock: "{{ state_attr(trigger.entity_id, 'low_stock_items') or [] }}"
      shopping_names: >
        {{ (state_attr(shopping_sensor, 'items') or [])
           | map(attribute='name') | list }}
      missing: >
        {{ low_stock
           | rejectattr('name', 'in', shopping_names)
           | list }}
  - repeat:
      for_each: "{{ missing }}"
      sequence:
        - action: pantrist.add_to_shopping_list
          data:
            name: "{{ repeat.item.name }}"
