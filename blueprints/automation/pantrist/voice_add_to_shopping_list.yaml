blueprint:
  name: "Pantrist: Voice — Add to shopping list"
  description: >
    Listen for sentences via Home Assistant Assist and forward the captured
    item name to Pantrist's `add_to_shopping_list` service. The default
    sentence list matches both English ("Add milk to the shopping list")
    and German ("Schreib Milch auf die Einkaufsliste") phrasings, so the
    automation works in either language out of the box.

    Customise the sentence list if you want different trigger phrases.
    Use `{item}` exactly once per sentence as the slot for the item name.
  source_url: https://github.com/Pantrist-dev/pantrist-ha-integration/blob/main/blueprints/automation/pantrist/voice_add_to_shopping_list.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    sentences:
      name: Sentences
      description: >
        Sentence patterns recognised by Assist. `{item}` is the wildcard
        captured as the item name.
      selector:
        text:
          multiple: true
      default:
        - "add {item} to [the ]shopping list"
        - "put {item} on [the ]shopping list"
        - "i need {item}"
        - "schreib {item} auf die einkaufsliste"
        - "(setz|setze) {item} auf die einkaufsliste"
        - "[bitte ]füge {item} (auf|zur) [die ]einkaufsliste [hinzu]"
        - "ich brauche {item}"
    confirmation:
      name: Spoken confirmation
      description: >
        Optional spoken response after adding. `{{ item }}` is the captured item.
      selector:
        text:
      default: "{{ item }} is on the shopping list."

mode: parallel

trigger:
  - platform: conversation
    command: !input sentences

action:
  - variables:
      item: "{{ trigger.slots.item | trim }}"
  - action: pantrist.add_to_shopping_list
    data:
      name: "{{ item }}"
  - set_conversation_response: !input confirmation
