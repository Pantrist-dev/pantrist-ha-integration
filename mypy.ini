[mypy]
python_version = 3.13
# Scope: the integration we own. The auto-generated OpenAPI client and the
# tests have their own per-section rules below.
files = custom_components/pantrist
exclude = (?x)(
    ^custom_components/pantrist/pantrist_client/   # auto-generated
  | ^\.venv/
  | ^build/
  | ^node_modules/
  )

# Pull in HA + third-party stubs where available; ignore ones we don't have
# (socketio, jose, etc.). This keeps mypy noise focused on our own code while
# still catching cross-module mistakes like the .asyncio vs .asyncio_detailed
# attribute mismatch.
ignore_missing_imports = True
follow_imports = silent

# Our own code gets the strict treatment.
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_return_any = True

# The generated client is opaque to us — only its public surface matters.
[mypy-custom_components.pantrist.pantrist_client.*]
ignore_errors = True

# Tests are pragmatic — we still type their signatures but don't strict-mode
# the mock plumbing.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
