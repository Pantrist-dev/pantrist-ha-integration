name: Pantrist
description: Integrates Pantrist shopping list and pantry manager with Home Assistant. Exposes shopping list and pantry items as sensors and provides services to add/check items.
version: "1.0.0"
slug: pantrist
url: https://github.com/nlueg/pantrist
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
homeassistant_api: true
options:
  api_token: ""
  refresh_token: ""
  socket_url: "https://api.pantrist.app"
  expiry_warning_days: 7
schema:
  api_token: str?
  refresh_token: str?
  socket_url: str
  expiry_warning_days: int
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Pantrist service API (used by HA rest_command integration)
map:
  - ssl
