# Integration Quality Scale — Bronze tier compliance.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Status values:
#   done    — rule satisfied
#   todo    — known gap, planned
#   exempt  — does not apply to this integration

rules:
  # ----- BRONZE -----
  action-setup: done
  appropriate-polling:
    status: done
    comment: >
      Fully push-driven via Socket.IO. List inventory (add / remove)
      arrives on the per-user ``user:{uid}`` room; list contents flow
      through the per-list ``data:updated`` events; rename and delete
      through ``list:updated`` / ``list:deleted``. The list_manager keeps
      a 1-hour reconcile against ``GET /list`` purely as a safety net
      for events missed while the socket was disconnected.
  brands: todo
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: >
      Only ``python-socketio`` is listed as a requirement — ``httpx`` and
      ``attrs`` (used by the generated OpenAPI client) are guaranteed by
      HA Core itself and must not be re-pinned, otherwise pip refuses to
      install when Core's pinned versions disagree.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ----- SILVER (not yet targeting) -----
  config-entry-unloading: done
  log-when-unavailable: done
  entity-unavailable: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >95% line + branch coverage across the integration code (excluding the auto-generated OpenAPI client).
  integration-owner: done
  parallel-updates: done
  action-exceptions: done

  # ----- GOLD / PLATINUM (partially in place) -----
  diagnostics: done
  reconfiguration-flow: done
  dynamic-devices: done
  stale-devices: done
  entity-category: done
  exception-translations: done
  repair-issues: done
  docs-data-update: done
  docs-known-limitations: done
  docs-use-cases: done
