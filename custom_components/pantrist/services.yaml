add_to_shopping_list:
  name: Add to shopping list
  description: Add an item by name to the connected Pantrist shopping list.
  fields:
    name:
      name: Item name
      description: Free-text item name (e.g., "Milk", "Bananas").
      required: true
      example: "Milk"
      selector:
        text:

add_to_shopping_list_by_barcode:
  name: Add to shopping list by barcode
  description: Look up a product by barcode and add it to the shopping list.
  fields:
    barcode:
      name: Barcode
      description: The product barcode (EAN-13, UPC-A, etc.).
      required: true
      example: "4006381333931"
      selector:
        text:

check_shopping_list_item:
  name: Check shopping-list item
  description: Mark an item on the shopping list as bought.
  fields:
    item_id:
      name: Item UUID
      description: The uuid attribute of the item (visible on sensor.pantrist_shopping_list).
      required: true
      selector:
        text:

delete_shopping_list_item:
  name: Delete shopping-list item
  description: Remove an item from the shopping list.
  fields:
    item_id:
      name: Item UUID
      description: The uuid attribute of the item.
      required: true
      selector:
        text:

add_to_pantry:
  name: Add to pantry
  description: Add an item by name to the connected Pantrist pantry.
  fields:
    name:
      name: Item name
      description: Free-text item name (e.g., "Olive oil").
      required: true
      example: "Olive oil"
      selector:
        text:
    amount:
      name: Amount
      description: Quantity of the item to add. Defaults to 1.
      required: false
      example: 1
      default: 1
      selector:
        number:
          step: 0.1
          mode: box
    unit_id:
      name: Unit
      description: Unit identifier (e.g., "pieces", "grams"). Defaults to "pieces".
      required: false
      default: "pieces"
      example: "pieces"
      selector:
        text:

delete_pantry_item:
  name: Delete pantry item
  description: Remove an item from the pantry.
  fields:
    item_id:
      name: Item UUID
      description: The uuid attribute of the item.
      required: true
      selector:
        text:

change_pantry_item_amount:
  name: Change pantry item amount
  description: Adjust the amount of a pantry item by a delta (positive to add, negative to consume).
  fields:
    name:
      name: Item name
      description: >
        Name of the pantry item to change (e.g. "Milk"). Looked up against
        your current pantry, so you don't need the UUID. Matching is
        case-insensitive and falls back to a partial match when it's
        unambiguous. Provide either this or the Item UUID.
      required: false
      example: "Milk"
      selector:
        text:
    item_id:
      name: Item UUID
      description: >
        The uuid attribute of the item (from sensor.pantrist_pantry → items).
        Optional — prefer the Item name field unless two items share a name.
      required: false
      selector:
        text:
    change:
      name: Change
      description: Positive to add, negative to consume.
      required: true
      selector:
        number:
          step: 0.1
          mode: box
    auto_restock:
      name: Auto-restock when below minimum
      description: >
        When enabled (the HA default), and the resulting pantry amount lands
        at or below the item's configured minimum, the Pantrist API also
        adds a full copy of the article (category, brand, unit, image, …) to
        the shopping list. Designed for HA-triggered flows (NFC scan, voice
        consume, …) where you want "consume + auto-reorder" in one
        round-trip. Set to ``false`` for bare-decrement use cases.
      required: false
      default: true
      selector:
        boolean:

search_pantry_items:
  name: Search pantry items
  description: >
    Look up pantry items and their UUIDs. Returns the matching items as a
    response — handy for finding the Item UUID to pass to "Change pantry item
    amount", or for chaining in a script via a response variable.
  fields:
    query:
      name: Search query
      description: >
        Name (or part of a name) to match, case-insensitively. Leave empty to
        return every item in the pantry.
      required: false
      example: "Milk"
      selector:
        text:

update_pantry_item:
  name: Update pantry item
  description: >
    Change a pantry item: its amount, content, unit, name, brand, notes,
    best-before date or minimum stock. Fields you leave out stay as they are.
  fields:
    name:
      name: Item name
      description: >
        Name of the pantry item (e.g. "Milk"), looked up like in Change
        pantry item amount. Provide either this or the Item UUID.
      required: false
      example: "Milk"
      selector:
        text:
    item_id:
      name: Item UUID
      description: >
        The uuid attribute of the item (from sensor.pantrist_pantry → items).
        Optional — prefer the Item name field unless two items share a name.
      required: false
      selector:
        text:
    amount:
      name: Amount
      description: How many packages are in stock.
      required: false
      example: 3
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    content_volume:
      name: Content per package
      description: How much one package holds, in the item's unit (e.g. 500 for 500 g).
      required: false
      example: 500
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    unit_id:
      name: Unit
      description: >
        Unit of the content, e.g. g, kg, ml, l, pieces, packet, or the uid of
        a unit you created in the app.
      required: false
      example: "g"
      selector:
        text:
    new_name:
      name: New name
      description: Rename the item.
      required: false
      selector:
        text:
    brand:
      name: Brand
      description: The item's brand. Set to null to clear it.
      required: false
      selector:
        text:
    notes:
      name: Notes
      description: Free-text notes. Set to null to clear them.
      required: false
      selector:
        text:
          multiline: true
    best_before:
      name: Best before
      description: >
        Best-before date for all of the item's stock; it shows up in the
        expiry calendar. Set to null to clear it.
      required: false
      selector:
        date:
    min_amount:
      name: Minimum amount
      description: >
        At or below this the item counts as low on stock. Setting it also
        switches minimum tracking on for the item.
      required: false
      example: 2
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    min_amount_mode:
      name: Minimum counts
      description: >
        packages: whole packages. content: the content in the item's unit,
        e.g. 3 rolls out of packs of 8.
      required: false
      selector:
        select:
          options:
            - packages
            - content
    manage_min_amount:
      name: Track minimum
      description: Switch low-stock tracking for this item on or off.
      required: false
      selector:
        boolean:
