add_to_shopping_list:
  name: Add to shopping list
  description: Add an item by name to the connected Pantrist shopping list.
  fields:
    name:
      name: Item name
      description: Free-text item name (e.g., "Milk", "Bananas").
      required: true
      example: "Milk"
      selector:
        text:

add_to_shopping_list_by_barcode:
  name: Add to shopping list by barcode
  description: Look up a product by barcode and add it to the shopping list.
  fields:
    barcode:
      name: Barcode
      description: The product barcode (EAN-13, UPC-A, etc.).
      required: true
      example: "4006381333931"
      selector:
        text:

check_shopping_list_item:
  name: Check shopping-list item
  description: Mark an item on the shopping list as bought.
  fields:
    item_id:
      name: Item UUID
      description: The uuid attribute of the item (visible on sensor.pantrist_shopping_list).
      required: true
      selector:
        text:

delete_shopping_list_item:
  name: Delete shopping-list item
  description: Remove an item from the shopping list.
  fields:
    item_id:
      name: Item UUID
      description: The uuid attribute of the item.
      required: true
      selector:
        text:

add_to_pantry:
  name: Add to pantry
  description: Add an item by name to the connected Pantrist pantry.
  fields:
    name:
      name: Item name
      description: Free-text item name (e.g., "Olive oil").
      required: true
      example: "Olive oil"
      selector:
        text:
    amount:
      name: Amount
      description: Quantity of the item to add. Defaults to 1.
      required: false
      example: 1
      default: 1
      selector:
        number:
          step: 0.1
          mode: box
    unit_id:
      name: Unit
      description: Unit identifier (e.g., "pieces", "grams"). Defaults to "pieces".
      required: false
      default: "pieces"
      example: "pieces"
      selector:
        text:

delete_pantry_item:
  name: Delete pantry item
  description: Remove an item from the pantry.
  fields:
    item_id:
      name: Item UUID
      description: The uuid attribute of the item.
      required: true
      selector:
        text:

change_pantry_item_amount:
  name: Change pantry item amount
  description: Adjust the amount of a pantry item by a delta (positive to add, negative to consume).
  fields:
    name:
      name: Item name
      description: >
        Name of the pantry item to change (e.g. "Milk"). Looked up against
        your current pantry, so you don't need the UUID. Matching is
        case-insensitive and falls back to a partial match when it's
        unambiguous. Provide either this or the Item UUID.
      required: false
      example: "Milk"
      selector:
        text:
    item_id:
      name: Item UUID
      description: >
        The uuid attribute of the item (from sensor.pantrist_pantry → items).
        Optional — prefer the Item name field unless two items share a name.
      required: false
      selector:
        text:
    change:
      name: Change
      description: Positive to add, negative to consume.
      required: true
      selector:
        number:
          step: 0.1
          mode: box
    auto_restock:
      name: Auto-restock when below minimum
      description: >
        When enabled (the HA default), and the resulting pantry amount lands
        at or below the item's configured minimum, the Pantrist API also
        adds a full copy of the article (category, brand, unit, image, …) to
        the shopping list. Designed for HA-triggered flows (NFC scan, voice
        consume, …) where you want "consume + auto-reorder" in one
        round-trip. Set to ``false`` for bare-decrement use cases.
      required: false
      default: true
      selector:
        boolean:
